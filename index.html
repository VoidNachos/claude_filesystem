<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude File Manager</title>
<style>
  :root {
    --bg:       #0d0f14;
    --surface:  #161a22;
    --border:   #252b38;
    --accent:   #7c6af7;
    --accent2:  #a78bfa;
    --green:    #34d399;
    --red:      #f87171;
    --yellow:   #fbbf24;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --font-ui:  'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOPBAR ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #topbar .logo {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  #topbar .path-bar {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #topbar .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #topbar .status-dot.ready  { background: var(--green); }
  #topbar .status-dot.busy   { background: var(--yellow); animation: pulse 1s infinite; }
  #topbar .status-dot.error  { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #topbar .status-text { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: #2d1515; }

  /* ── MAIN LAYOUT ── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 260px;
    min-width: 160px;
    max-width: 400px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    resize: horizontal;
  }
  #sidebar-toolbar {
    display: flex;
    gap: 4px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sidebar-toolbar .btn { flex: 1; text-align: center; padding: 4px 6px; font-size: 11px; }
  #tree {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  #tree::-webkit-scrollbar { width: 4px; }
  #tree::-webkit-scrollbar-track { background: transparent; }
  #tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 4px;
    margin: 1px 4px;
    user-select: none;
    position: relative;
  }
  .tree-item:hover { background: var(--border); }
  .tree-item.selected { background: #1e1b4b; color: var(--accent2); }
  .tree-item .icon { flex-shrink: 0; font-size: 13px; }
  .tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-item .name.editing {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 0 4px;
    outline: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    width: 140px;
  }
  .tree-item .actions {
    display: none;
    gap: 4px;
    flex-shrink: 0;
  }
  .tree-item:hover .actions { display: flex; }
  .tree-item .actions button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    padding: 2px 3px;
    border-radius: 3px;
  }
  .tree-item .actions button:hover { color: var(--text); background: var(--bg); }
  .tree-dir-children { padding-left: 16px; }

  /* ── EDITOR ── */
  #editor-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #editor-tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  #editor-tabs::-webkit-scrollbar { height: 2px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 12px;
    font-family: var(--font-mono);
    cursor: pointer;
    white-space: nowrap;
    border-right: 1px solid var(--border);
    color: var(--muted);
    border-bottom: 2px solid transparent;
    flex-shrink: 0;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); background: var(--bg); }
  .tab .close {
    opacity: 0;
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px;
    font-size: 10px;
  }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .tab .close:hover { background: var(--border); }
  #editor-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #editor-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    gap: 12px;
    font-size: 14px;
  }
  #editor-placeholder .icon { font-size: 48px; opacity: 0.3; }
  #editor-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #editor-toolbar .file-info { font-family: var(--font-mono); font-size: 11px; color: var(--muted); flex: 1; }
  #editor-toolbar .modified-dot { color: var(--yellow); font-size: 18px; line-height: 1; display: none; }
  #editor-toolbar .modified-dot.show { display: block; }
  #code-editor {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    tab-size: 2;
  }

  /* ── UPLOAD DROP ZONE ── */
  #drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(124, 106, 247, 0.15);
    border: 3px dashed var(--accent);
    z-index: 100;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--accent2);
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  /* ── MODAL ── */
  #modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #modal-bg.show { display: flex; }
  #modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    min-width: 340px;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #modal h2 { font-size: 15px; font-weight: 600; }
  #modal input, #modal select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
  }
  #modal input:focus, #modal select:focus { border-color: var(--accent); }
  #modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  #modal label { font-size: 12px; color: var(--muted); }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    z-index: 300;
    transform: translateY(80px);
    opacity: 0;
    transition: transform 0.2s, opacity 0.2s;
    max-width: 340px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { border-color: var(--green); color: var(--green); }
  #toast.error   { border-color: var(--red);   color: var(--red); }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  #setup-screen.show { display: flex; }
  #setup-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 400px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  #setup-box h1 { font-size: 18px; font-weight: 700; color: var(--accent2); }
  #setup-box p  { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #setup-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
  }
  #setup-box input:focus { border-color: var(--accent); }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div id="setup-box">
    <h1>⚡ Claude File Manager</h1>
    <p>Enter your Pi bridge server URL (the ngrok URL running <code>pi_server.py</code>).</p>
    <div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Pi Server URL</label>
      <input id="pi-url-input" type="url" placeholder="https://abc123.ngrok.io" />
    </div>
    <div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">GitHub Repo (for reading file tree)</label>
      <input id="repo-input" type="text" placeholder="username/repo-name" />
    </div>
    <button class="btn primary" onclick="saveSetup()">Connect</button>
  </div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">⚡ CLAUDEFS</div>
  <div class="path-bar" id="path-bar">/</div>
  <div class="status-dot" id="status-dot"></div>
  <div class="status-text" id="status-text">connecting...</div>
  <button class="btn" onclick="refresh()">↻ Refresh</button>
  <button class="btn" onclick="showSettings()">⚙</button>
</div>

<!-- MAIN -->
<div id="main">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-toolbar">
      <button class="btn" title="New File" onclick="newFile()">＋ File</button>
      <button class="btn" title="New Folder" onclick="newFolder()">＋ Folder</button>
      <button class="btn" title="Upload File" onclick="triggerUpload()">↑ Upload</button>
    </div>
    <div id="tree"></div>
  </div>

  <!-- EDITOR -->
  <div id="editor-pane">
    <div id="editor-tabs"></div>
    <div id="editor-toolbar" style="display:none">
      <div class="file-info" id="editor-file-info"></div>
      <span class="modified-dot" id="modified-dot">●</span>
      <button class="btn primary" onclick="saveFile()">Save</button>
      <button class="btn danger" onclick="deleteCurrentFile()">Delete</button>
    </div>
    <div id="editor-area">
      <div id="editor-placeholder">
        <div class="icon">📁</div>
        <div>Select a file to edit</div>
        <div style="font-size:12px;color:var(--muted)">or drag & drop to upload</div>
      </div>
      <textarea id="code-editor" spellcheck="false" style="display:none"
        oninput="onEditorInput()"></textarea>
    </div>
  </div>
</div>

<!-- DROP OVERLAY -->
<div id="drop-overlay">Drop files to upload</div>

<!-- MODAL -->
<div id="modal-bg" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title">Modal</h2>
    <div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="file-input" style="display:none" multiple onchange="handleFileInput(this.files)">

<script>
// ── CONFIG ────────────────────────────────────────────────────────
let PI_URL  = localStorage.getItem("pi_url")  || "";
let REPO    = localStorage.getItem("gh_repo") || "";
const BRANCH = "main";
let fileTree = null;
let openTabs = {};        // path → {content, modified}
let activeTab = null;
let pollInterval = null;

// ── SETUP ─────────────────────────────────────────────────────────
function saveSetup() {
  PI_URL = document.getElementById("pi-url-input").value.trim().replace(/\/$/, "");
  REPO   = document.getElementById("repo-input").value.trim();
  localStorage.setItem("pi_url",  PI_URL);
  localStorage.setItem("gh_repo", REPO);
  document.getElementById("setup-screen").classList.remove("show");
  init();
}
function showSettings() {
  document.getElementById("pi-url-input").value = PI_URL;
  document.getElementById("repo-input").value   = REPO;
  document.getElementById("setup-screen").classList.add("show");
}

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  if (!PI_URL || !REPO) {
    document.getElementById("setup-screen").classList.add("show");
    return;
  }
  setStatus("connecting");
  await refresh();
  pollInterval = setInterval(pollStatus, 3000);
}

// ── STATUS POLLING ─────────────────────────────────────────────────
async function pollStatus() {
  try {
    const r = await fetch(`${PI_URL}/api/status`);
    const d = await r.json();
    if (d.busy) {
      setStatus("busy", d.last_op || "working...");
    } else {
      setStatus("ready");
    }
  } catch {
    setStatus("error", "Pi offline");
  }
}

function setStatus(state, msg) {
  const dot  = document.getElementById("status-dot");
  const text = document.getElementById("status-text");
  dot.className  = "status-dot " + state;
  text.textContent = msg || state;
}

// ── FILE TREE ──────────────────────────────────────────────────────
async function refresh() {
  setStatus("busy", "loading...");
  try {
    // Fetch filetree.json from GitHub Pages repo
    const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/filetree.json?t=${Date.now()}`;
    const r   = await fetch(url);
    if (!r.ok) throw new Error("filetree.json not found — ask Claude to push one");
    fileTree = await r.json();
    renderTree(fileTree);
    setStatus("ready");
  } catch (e) {
    setStatus("error", e.message);
    toast("Could not load file tree: " + e.message, "error");
  }
}

function renderTree(node, container, path = "") {
  if (!container) container = document.getElementById("tree");
  container.innerHTML = "";

  const entries = Object.entries(node).sort(([a, av], [b, bv]) => {
    const aDir = typeof av === "object" && av !== null && !av.__file;
    const bDir = typeof bv === "object" && bv !== null && !bv.__file;
    if (aDir !== bDir) return aDir ? -1 : 1;
    return a.localeCompare(b);
  });

  for (const [name, val] of entries) {
    const fullPath = path ? `${path}/${name}` : `/${name}`;
    const isDir    = typeof val === "object" && val !== null && !val.__file;
    const item     = document.createElement("div");
    item.className = "tree-item";
    item.dataset.path = fullPath;

    const icon    = document.createElement("span");
    icon.className = "icon";
    icon.textContent = isDir ? "📁" : fileIcon(name);

    const nameEl  = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = name;

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.innerHTML = `
      <button title="Rename" onclick="renameItem(event,'${fullPath}')">✏</button>
      <button title="Delete" onclick="deleteItem(event,'${fullPath}')">🗑</button>
    `;

    item.appendChild(icon);
    item.appendChild(nameEl);
    item.appendChild(actions);
    container.appendChild(item);

    if (isDir) {
      const children = document.createElement("div");
      children.className = "tree-dir-children";
      children.style.display = "none";
      container.appendChild(children);

      item.addEventListener("click", () => {
        const open = children.style.display !== "none";
        children.style.display = open ? "none" : "block";
        icon.textContent = open ? "📁" : "📂";
        if (!open && children.childElementCount === 0) {
          renderTree(val, children, fullPath);
        }
      });
    } else {
      item.addEventListener("click", () => openFile(fullPath, val));
    }
  }
}

function fileIcon(name) {
  const ext = name.split(".").pop().toLowerCase();
  const map = {
    py:"🐍", js:"📜", ts:"📜", jsx:"⚛", tsx:"⚛",
    html:"🌐", css:"🎨", json:"📋", md:"📝",
    c:"⚙", h:"⚙", cpp:"⚙", rs:"🦀",
    sh:"💻", bash:"💻", txt:"📄", log:"📋",
    png:"🖼", jpg:"🖼", gif:"🖼", svg:"🖼",
    zip:"📦", tar:"📦", gz:"📦",
  };
  return map[ext] || "📄";
}

// ── FILE OPEN / EDITOR ─────────────────────────────────────────────
async function openFile(path, meta) {
  setPathBar(path);
  if (openTabs[path]) {
    activateTab(path);
    return;
  }

  setStatus("busy", "loading file...");
  try {
    // Fetch file content from GitHub raw
    const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/files${path}?t=${Date.now()}`;
    const r   = await fetch(url);
    const content = r.ok ? await r.text() : "";

    openTabs[path] = { content, modified: false };
    addTab(path);
    activateTab(path);
    setStatus("ready");
  } catch (e) {
    toast("Could not load file: " + e.message, "error");
    setStatus("error");
  }
}

function addTab(path) {
  const tabs = document.getElementById("editor-tabs");
  const tab  = document.createElement("div");
  tab.className = "tab";
  tab.dataset.path = path;
  tab.innerHTML = `
    <span>${path.split("/").pop()}</span>
    <span class="close" onclick="closeTab(event,'${path}')">✕</span>
  `;
  tab.addEventListener("click", () => activateTab(path));
  tabs.appendChild(tab);
}

function activateTab(path) {
  activeTab = path;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.path === path);
  });

  const ed = document.getElementById("code-editor");
  const ph = document.getElementById("editor-placeholder");
  const tb = document.getElementById("editor-toolbar");
  const data = openTabs[path];

  ed.style.display  = "block";
  ph.style.display  = "none";
  tb.style.display  = "flex";
  ed.value = data.content;
  document.getElementById("editor-file-info").textContent = path;
  document.getElementById("modified-dot").classList.toggle("modified", data.modified);

  // syntax highlight hint
  setPathBar(path);
}

function closeTab(e, path) {
  e.stopPropagation();
  delete openTabs[path];
  const tab = document.querySelector(`.tab[data-path="${path}"]`);
  if (tab) tab.remove();

  const remaining = Object.keys(openTabs);
  if (remaining.length) activateTab(remaining[remaining.length - 1]);
  else {
    document.getElementById("code-editor").style.display = "none";
    document.getElementById("editor-placeholder").style.display = "flex";
    document.getElementById("editor-toolbar").style.display = "none";
    activeTab = null;
  }
}

function onEditorInput() {
  if (!activeTab) return;
  openTabs[activeTab].content  = document.getElementById("code-editor").value;
  openTabs[activeTab].modified = true;
  document.getElementById("modified-dot").classList.add("show");
  document.querySelector(`.tab[data-path="${activeTab}"] span`)
    && (document.querySelector(`.tab[data-path="${activeTab}"]`).style.opacity = "0.8");
}

// ── FILE OPERATIONS ────────────────────────────────────────────────
async function saveFile() {
  if (!activeTab) return;
  const content = document.getElementById("code-editor").value;
  const ok = await sendOp("edit", { path: activeTab, content });
  if (ok) {
    openTabs[activeTab].modified = false;
    document.getElementById("modified-dot").classList.remove("show");
    toast(`Saved ${activeTab}`, "success");
  }
}

async function deleteCurrentFile() {
  if (!activeTab) return;
  if (!confirm(`Delete ${activeTab}?`)) return;
  const ok = await sendOp("delete", { path: activeTab });
  if (ok) {
    closeTab({ stopPropagation: ()=>{} }, activeTab);
    toast("Deleted", "success");
    setTimeout(refresh, 8000);
  }
}

async function deleteItem(e, path) {
  e.stopPropagation();
  if (!confirm(`Delete ${path}?`)) return;
  const ok = await sendOp("delete", { path });
  if (ok) { toast("Deleted", "success"); setTimeout(refresh, 8000); }
}

async function renameItem(e, path) {
  e.stopPropagation();
  const newName = prompt("Rename to:", path.split("/").pop());
  if (!newName || newName === path.split("/").pop()) return;
  const dir     = path.split("/").slice(0, -1).join("/") || "/";
  const newPath = `${dir}/${newName}`;
  const ok = await sendOp("rename", { old_path: path, new_path: newPath });
  if (ok) { toast("Renamed", "success"); setTimeout(refresh, 8000); }
}

async function newFile() {
  showModal("New File", `
    <label>Path (from root)</label>
    <input id="m-path" type="text" placeholder="/home/claude/newfile.py" />
  `, "Create", async () => {
    const path = document.getElementById("m-path").value.trim();
    if (!path) return;
    const ok = await sendOp("edit", { path, content: "" });
    if (ok) { closeModal(); toast("Created", "success"); setTimeout(refresh, 8000); }
  });
}

async function newFolder() {
  showModal("New Folder", `
    <label>Path (from root)</label>
    <input id="m-path" type="text" placeholder="/home/claude/newdir" />
  `, "Create", async () => {
    const path = document.getElementById("m-path").value.trim();
    if (!path) return;
    const ok = await sendOp("mkdir", { path });
    if (ok) { closeModal(); toast("Created", "success"); setTimeout(refresh, 8000); }
  });
}

// ── UPLOAD ────────────────────────────────────────────────────────
function triggerUpload() {
  document.getElementById("file-input").click();
}

async function handleFileInput(files) {
  for (const file of files) {
    showModal("Upload File", `
      <label>Upload <strong>${file.name}</strong> to path:</label>
      <input id="m-dest" type="text" value="/home/claude/${file.name}" />
    `, "Upload", async () => {
      const dest = document.getElementById("m-dest").value.trim();
      closeModal();
      await uploadFile(file, dest);
    });
  }
}

async function uploadFile(file, dest) {
  setStatus("busy", `uploading ${file.name}...`);
  const fd = new FormData();
  fd.append("file", file);
  fd.append("dest_path", dest);
  try {
    const r = await fetch(`${PI_URL}/api/upload`, { method: "POST", body: fd });
    const d = await r.json();
    if (d.ok) {
      toast(`Uploaded → ${dest}`, "success");
      setTimeout(refresh, 10000);
    } else {
      toast("Upload failed: " + d.error, "error");
    }
  } catch (e) {
    toast("Upload error: " + e.message, "error");
  }
  setStatus("ready");
}

// Drag & drop
document.addEventListener("dragover",  e => { e.preventDefault(); document.getElementById("drop-overlay").classList.add("show"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.getElementById("drop-overlay").classList.remove("show"); });
document.addEventListener("drop", async e => {
  e.preventDefault();
  document.getElementById("drop-overlay").classList.remove("show");
  const files = Array.from(e.dataTransfer.files);
  for (const file of files) await handleFileInput([file]);
});

// ── SEND OP ───────────────────────────────────────────────────────
async function sendOp(type, payload) {
  setStatus("busy", `${type}...`);
  try {
    const r = await fetch(`${PI_URL}/api/operation`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ type, payload }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "unknown error");
    setStatus("ready");
    return true;
  } catch (e) {
    toast("Error: " + e.message, "error");
    setStatus("error", e.message);
    return false;
  }
}

// ── UI HELPERS ─────────────────────────────────────────────────────
function setPathBar(path) {
  document.getElementById("path-bar").textContent = path;
}

function toast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className   = `show ${type}`;
  setTimeout(() => t.classList.remove("show"), 3500);
}

function showModal(title, bodyHTML, confirmLabel, onConfirm) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML    = bodyHTML;
  document.getElementById("modal-btns").innerHTML    = `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary" id="modal-confirm">${confirmLabel}</button>
  `;
  document.getElementById("modal-confirm").onclick = onConfirm;
  document.getElementById("modal-bg").classList.add("show");
  // focus first input
  setTimeout(() => {
    const inp = document.querySelector("#modal input");
    if (inp) { inp.focus(); inp.select(); }
  }, 50);
}
function closeModal() {
  document.getElementById("modal-bg").classList.remove("show");
}

// Enter key in modal
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && document.getElementById("modal-bg").classList.contains("show")) {
    const btn = document.getElementById("modal-confirm");
    if (btn && document.activeElement?.tagName !== "BUTTON") btn.click();
  }
  // Ctrl+S to save
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    saveFile();
  }
});

// ── BOOT ──────────────────────────────────────────────────────────
init();
</script>
